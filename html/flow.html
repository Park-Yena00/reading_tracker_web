<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 흐름 - Reading Tracker</title>
    
    <!-- 공통 CSS -->
    <link rel="stylesheet" href="../css/common/variables.css">
    <link rel="stylesheet" href="../css/common/reset.css">
    <link rel="stylesheet" href="../css/common/layout.css">
    <link rel="stylesheet" href="../css/common/header-footer.css">
    
    <!-- 컴포넌트 CSS -->
    <link rel="stylesheet" href="../css/components/button.css">
    <link rel="stylesheet" href="../css/components/card.css">
    <link rel="stylesheet" href="../css/components/badge.css">
    <link rel="stylesheet" href="../css/components/loading.css">
    <link rel="stylesheet" href="../css/components/modal.css">
    
    <!-- 페이지 CSS -->
    <link rel="stylesheet" href="../css/pages/flow.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- 헤더 -->
        <div id="header"></div>
        
        <!-- 메인 콘텐츠 -->
        <main class="page-main">
            <div class="container">
                <!-- 페이지 헤더 -->
                <div class="flow-header">
                    <div class="flow-header-actions">
                        <button id="btn-select-book" class="btn btn-primary">
                            메모 작성
                        </button>
                        <a href="/" class="btn btn-secondary" id="btn-home">홈으로</a>
                    </div>
                </div>
                
                <!-- 로딩 스피너 -->
                <div id="loading-spinner" class="spinner-overlay" style="display: none;">
                    <div class="spinner spinner-large"></div>
                </div>
                
                <!-- 캘린더 상단 바 -->
                <div id="inline-calendar-section" class="inline-calendar-section flow-calendar-bar">
                    <div class="date-header">
                        <span id="current-date" class="current-date"></span>
                    </div>
                    <div id="inline-calendar-container" class="inline-calendar-container">
                        <!-- 캘린더가 여기에 동적으로 렌더링됩니다 -->
                    </div>
                </div>

                <!-- 도서 인덱스 컬러바 -->
                <div id="memo-index-bar" class="memo-index-bar" style="display: none;">
                    <div id="memo-index-bar-list" class="memo-index-bar-list">
                        <!-- 책별 인덱스가 여기에 동적으로 추가됩니다 -->
                    </div>
                </div>
                
                <!-- 2컬럼 레이아웃 -->
                <div class="flow-container">
                    <!-- 좌측 네비게이션/필터 패널 -->
                    <aside id="flow-sidebar" class="flow-sidebar">
                    </aside>
                    
                    <!-- 우측 메모 콘텐츠 영역 -->
                    <div class="flow-content">
                        <button id="btn-close-book" class="btn btn-secondary" style="display: none;">
                            책 덮기
                        </button>
                        
                        
                        <!-- 메모 입력 모듈 (동적으로 메모 섹션 내부로 이동) -->
                        <div id="memo-editor" class="memo-editor binder-note" style="display: none;">
                            <!-- 메모 입력 영역 (책 선택 후 활성화) -->
                            <div id="memo-input-container" class="memo-input-container" style="display: none;">
                                <!-- 페이지 번호 입력 -->
                                <div class="memo-page-container">
                                    <label for="memo-page-input" class="input-label">페이지 번호</label>
                                    <input 
                                        type="number" 
                                        id="memo-page-input" 
                                        class="memo-page-input" 
                                        placeholder="페이지 번호를 입력하세요"
                                        min="1"
                                        required
                                    />
                                </div>
                                
                                <!-- 태그 선택 -->
                                <div class="tag-chips-container">
                                    <label class="input-label">태그 선택</label>
                                    <div id="memo-tag-category-accordion" class="memo-tag-category-accordion">
                                        <div class="accordion-item">
                                            <button class="accordion-header" data-category="TYPE">
                                                <span>유형 (TYPE)</span>
                                                <span class="accordion-icon">▼</span>
                                            </button>
                                            <div class="accordion-content" data-category="TYPE">
                                                <div id="tag-chips-type" class="tag-chips">
                                                    <!-- TYPE 태그 칩들이 여기에 동적으로 추가됩니다 -->
                                                </div>
                                            </div>
                                        </div>
                                        <div class="accordion-item">
                                            <button class="accordion-header" data-category="TOPIC">
                                                <span>주제 (TOPIC)</span>
                                                <span class="accordion-icon">▼</span>
                                            </button>
                                            <div class="accordion-content" data-category="TOPIC">
                                                <div id="tag-chips-topic" class="tag-chips">
                                                    <!-- TOPIC 태그 칩들이 여기에 동적으로 추가됩니다 -->
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- 메모 본문 입력 -->
                                <div class="memo-text-container">
                                    <label for="memo-input" class="input-label">메모 내용</label>
                                    <textarea 
                                        id="memo-input" 
                                        class="memo-input" 
                                        placeholder="메모를 입력하세요..."
                                        rows="6"
                                    ></textarea>
                                </div>
                                
                                <!-- 저장/취소 버튼 -->
                                <div class="memo-actions">
                                    <button id="btn-save-memo" class="btn btn-primary">
                                        저장
                                    </button>
                                    <button id="btn-cancel-memo" class="btn btn-secondary">
                                        취소
                                    </button>
                                </div>
                            </div>
                            
                            <!-- 빈 상태 메시지 -->
                            <div id="empty-state" class="empty-state" style="display: none;">
                                <p>메모가 없습니다.</p>
                                <p class="empty-state-hint">책을 선택하고 메모를 작성해보세요.</p>
                            </div>
                        </div>
                        
                        <!-- 메모 디스플레이 영역 (바인더 노트 형식) -->
                        <div id="memo-list" class="memo-list binder-note">
                            <!-- 메모 카드들이 여기에 동적으로 추가됩니다 -->
                        </div>
                        
                        <!-- 페이지네이션 -->
                        <div id="memo-pagination" class="memo-pagination" style="display: none;">
                            <button id="btn-prev-page" class="btn-pagination btn-pagination-prev" disabled>이전</button>
                            <span id="pagination-info" class="pagination-info">1 / 1</span>
                            <button id="btn-next-page" class="btn-pagination btn-pagination-next" disabled>다음</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- 책 덮기 모달 -->
        <div id="close-book-modal" class="modal-overlay" style="display: none;">
            <div class="modal">
                <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">책 덮기</h3>
                    <button class="modal-close" id="close-book-modal-close" aria-label="닫기">
                        ×
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="close-book-progress" class="input-label">
                            현재 읽은 페이지 수
                        </label>
                        <input 
                            type="number" 
                            id="close-book-progress" 
                            class="form-input"
                            placeholder="페이지 수를 입력하세요"
                            min="1"
                            required
                        />
                        <p class="form-hint" id="close-book-total-pages"></p>
                    </div>
                    
                    <!-- Finished 카테고리로 변경될 경우 표시되는 필드 -->
                    <div id="close-book-finished-fields" style="display: none;">
                        <div class="form-group">
                            <label for="close-book-finished-date" class="input-label">
                                독서 종료일 <span class="required">*</span>
                            </label>
                            <input 
                                type="date" 
                                id="close-book-finished-date" 
                                class="form-input"
                                required
                            />
                        </div>
                        
                        <div class="form-group">
                            <label class="input-label">평점 <span class="required">*</span></label>
                            <div id="close-book-rating-stars" class="rating-stars-input" data-rating="0">
                                <span class="star" data-value="1">☆</span>
                                <span class="star" data-value="2">☆</span>
                                <span class="star" data-value="3">☆</span>
                                <span class="star" data-value="4">☆</span>
                                <span class="star" data-value="5">☆</span>
                            </div>
                            <input type="hidden" id="close-book-rating" value="0" required />
                        </div>
                        
                        <div class="form-group">
                            <label for="close-book-review" class="input-label">후기</label>
                            <textarea 
                                id="close-book-review" 
                                class="form-input"
                                placeholder="후기를 입력하세요 (선택사항)"
                                rows="4"
                            ></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="close-book-cancel" class="btn btn-secondary">취소</button>
                    <button id="close-book-confirm" class="btn btn-primary">확인</button>
                </div>
                </div>
            </div>
        </div>
        
        <!-- 푸터 -->
        <div id="footer"></div>
    </div>
    
    <!-- 책 선택 모달 -->
    <div id="book-selector-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">책 선택</h2>
                <button class="modal-close" aria-label="닫기">&times;</button>
            </div>
            <div class="modal-body">
                <div id="book-selector-list" class="book-selector-list">
                    <!-- 책 목록이 여기에 동적으로 추가됩니다 -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- API 설정 -->
    <script src="../js/api/config.js"></script>
    
    <!-- 공통 유틸리티 -->
    <script type="module" src="../js/utils/event-bus.js"></script>
    <script type="module" src="../js/utils/token-manager.js"></script>
    <script type="module" src="../js/utils/date-formatter.js"></script>
    
    <!-- 상태 관리 -->
    <script type="module" src="../js/state/auth-state.js"></script>
    <script type="module" src="../js/state/book-state.js"></script>
    
    <!-- API 클라이언트 -->
    <script type="module" src="../js/services/api-client.js"></script>
    <script type="module" src="../js/services/book-service.js"></script>
    <script type="module" src="../js/services/memo-service.js"></script>
    
    <!-- 공통 컴포넌트 -->
    <script type="module" src="../js/views/common/header.js"></script>
    <script type="module" src="../js/views/common/footer.js"></script>
    <script type="module" src="../js/views/common/modal.js"></script>
    
    <!-- 컴포넌트 -->
    <script type="module" src="../js/components/memo-card.js"></script>
    <script type="module" src="../js/components/memo-editor.js"></script>
    <script type="module" src="../js/components/book-selector.js"></script>
    
    <!-- 오늘의 흐름 페이지 뷰 -->
    <script type="module" src="../js/views/pages/flow-view.js"></script>
</body>
</html>
