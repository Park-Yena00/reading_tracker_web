<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Tracker - 독서 기록 사이트</title>
    
    <!-- 공통 CSS -->
    <link rel="stylesheet" href="css/common/variables.css">
    <link rel="stylesheet" href="css/common/reset.css">
    <link rel="stylesheet" href="css/common/layout.css">
    <link rel="stylesheet" href="css/common/header-footer.css">
    
    <!-- 컴포넌트 CSS -->
    <link rel="stylesheet" href="css/components/button.css">
    
    <!-- 페이지 CSS -->
    <link rel="stylesheet" href="css/pages/home.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- 헤더 -->
        <div id="header"></div>
        
        <!-- 메인 콘텐츠 -->
        <main class="page-main">
            <!-- 메인 배너 -->
            <section class="hero-section">
                <div class="container">
                    <div class="hero-content">
                        <h1 class="hero-title">이 리 저 리</h1>
                        <p class="hero-subtitle">한 번에 여러 권의 생각을 정리하세요.</p>
                        <div class="hero-actions">
                            <a href="html/book-search.html" class="btn btn-primary btn-large">책 살펴보기</a>
                        </div>
                    </div>
                </div>
            </section>
            
            <!-- 통계 대시보드 섹션 -->
            <section class="stats-dashboard-section">
                <div class="container">
                    <div class="stats-tabs">
                        <button class="stats-tab-btn active" data-tab="daily">일별 통계</button>
                        <button class="stats-tab-btn" data-tab="monthly">월별 통계</button>
                        <button class="stats-tab-btn" data-tab="yearly">연별 통계</button>
                    </div>
                    
                    <div id="stats-content" class="stats-content">
                        <!-- 통계 내용이 동적으로 로드됩니다 -->
                        <div id="stats-loading" class="stats-loading" style="display: none;">
                            <div class="spinner"></div>
                            <p>통계 데이터를 불러오는 중...</p>
                        </div>
                        <div id="stats-display" class="stats-display"></div>
                    </div>
                </div>
            </section>
        </main>
        
        <!-- 푸터 -->
        <div id="footer"></div>
    </div>
    
    <!-- API 설정 -->
    <script src="js/api/config.js"></script>
    
    <!-- 공통 유틸리티 -->
    <script type="module" src="js/utils/event-bus.js"></script>
    <script type="module" src="js/utils/token-manager.js"></script>
    
    <!-- 상태 관리 -->
    <script type="module" src="js/state/auth-state.js"></script>
    
    <!-- 공통 컴포넌트 -->
    <script type="module" src="js/views/common/header.js"></script>
    <script type="module" src="js/views/common/footer.js"></script>
    
    <!-- 홈 페이지 초기화 -->
    <script type="module">
        import { HeaderView } from './js/views/common/header.js';
        import { FooterView } from './js/views/common/footer.js';
        import { HomeView } from './js/views/pages/home-view.js';
        
        // 헤더와 푸터 렌더링
        new HeaderView('header');
        new FooterView('footer');
        
        // 홈 뷰 초기화
        new HomeView();
    </script>
</body>
</html>
